services:
  - type: web
    name: verifyhire-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: VERIFIED_COMPANY_DOMAINS
        sync: false
      - key: RECRUITMENT_PLATFORM_DOMAINS
        value: linkedin.com,indeed.com,ziprecruiter.com
